name: Recover Secrets
on:
  # Add push as a hack to make GitHub recognize the action when we're testing
  # on a branch.  Pushing a commit will trigger the workflow.
  push:
  workflow_dispatch:
jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      RECOVERY_PASSPHRASE: "${{ secrets.RECOVERY_PASSPHRASE }}"
    steps:
      - name: Verify recovery encryption passphrase exists
        run: |
          if [ -z "$RECOVERY_PASSPHRASE" ]; then
            echo "ERROR: RECOVERY_PASSPHRASE is not set!"
            exit 1
          fi
      - name: Prepare workspace
        run: |
          set -euo pipefail
          umask 077
          mkdir -p repository
      - name: Export and Encrypt Repository Secrets
        env:
          DOCKER_HUB_PAT: ${{ secrets.DOCKER_HUB_PAT }}
        run: |
          set -euo pipefail
          secrets=(
            DOCKER_HUB_PAT
          )
          for s in "${secrets[@]}"; do
            echo "Encrypting $s"
            val="${!s}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | openssl enc -aes-256-cbc -salt -pbkdf2 \
                -out "repository/${s}.enc" \
                -pass pass:"$RECOVERY_PASSPHRASE"
              chmod 600 "repository/${s}.enc"
            else
              echo "Warning: secret $s is empty or not defined" >&2
            fi
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repository
          path: repository/
