name: Publish Docker

on:
  push:
    branches:
      - saga
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Don't overwhelm the toolchain server
      max-parallel: 1
      matrix:
        include:
          # We just build the default images (v3.1.1 SDK and v3.1.1 toolchain)
          - SLIM: 0
            SDK: v3.1.1
            TOOLCHAIN: v3.1.1
            description: full
            native_board: native_sim

          - SLIM: 1
            SDK: v3.1.1
            TOOLCHAIN: v3.1.1
            description: slim
            native_board: native_sim

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build image
        run: |
          docker build -t ncs-${{ matrix.description }}:${{ matrix.SDK }} \
            --build-arg SDK_NRF_BRANCH=${{ matrix.SDK }} \
            --build-arg TOOLCHAIN_VERSION=${{ matrix.TOOLCHAIN }} \
            --build-arg SLIM=${{ matrix.SLIM }} \
            .

      - name: Build asset_tracker_v2 application
        run: |
          docker run --rm \
            -v ${PWD}:/workdir/project \
            -w /workdir/nrf/applications/connectivity_bridge \
            ncs-${{ matrix.description }}:${{ matrix.SDK }} \
            west build -b thingy91/nrf52840 --build-dir /workdir/project/build -- -DEXTRA_CFLAGS="-Werror -Wno-dev"

      - name: Ensure nrfjprog works on the full version
        if: ${{ matrix.SLIM == 0 }}
        run: |
          docker run --rm ncs-${{ matrix.description }}:${{ matrix.SDK }} nrfjprog -v

      - name: Ensure clang-format works
        run: |
          docker run --rm ncs-${{ matrix.description }}:${{ matrix.SDK }} clang-format --version

      - name: Ensure native build works
        run: |
          docker run --rm ncs-${{ matrix.description }}:${{ matrix.SDK }} west build -b ${{ matrix.native_board }} zephyr/samples/hello_world

      - name: Ensure zephyr twister unit tests works
        run: |
          docker run --rm ncs-${{ matrix.description }}:${{ matrix.SDK }} ./zephyr/scripts/twister -p ${{ matrix.native_board }} -T zephyr/samples/subsys/testsuite/integration

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: saferetrieve
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Publish image
        run: |
          docker tag ncs-${{ matrix.description }}:${{ matrix.SDK }} saferetrieve/ncs-${{ matrix.description }}:${{ matrix.SDK }}
          docker images
          docker push saferetrieve/ncs-${{ matrix.description }}:${{ matrix.SDK }}
